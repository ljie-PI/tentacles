[project]
name = "tentacles"
version = "0.1.0"
description = "Fetch news feeds from multiple sources, aggregate and deduplicate them, and generate LLM-written daily digests and in-depth reports."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "feedparser>=6.0",
    "httpx[socks]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
tentacles = "tentacles.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tentacles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
