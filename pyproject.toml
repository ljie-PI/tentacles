[project]
name = "tentacles"
version = "0.2.0"
description = "Personal information and news manager: multi-source fetching, persona-based filtering and LLM processing."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "feedparser>=6.0",
    "httpx[socks]>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
tentacles = "tentacles.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tentacles"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
