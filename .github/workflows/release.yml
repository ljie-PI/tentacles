name: Release Wheel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"

      - name: Typecheck backend & verify OpenAPI types
        run: |
          mypy src/tentacles
          cd frontend
          pnpm install --frozen-lockfile
          TENTACLES_PYTHON="$(which python)" pnpm check:api
          pnpm build

      - name: Build self-contained wheel
        run: |
          TENTACLES_PYTHON="$(which python)" ./scripts/build-wheel.sh --skip-frontend
          ls -lh dist/*.whl

      - name: Smoke-test wheel in isolated environment
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/tentacles-*.whl
          cd /tmp
          HOME=/tmp/smoke-home /tmp/smoke-venv/bin/tentacles --json init
          HOME=/tmp/smoke-home /tmp/smoke-venv/bin/tentacles --json config check
          HOME=/tmp/smoke-home /tmp/smoke-venv/bin/tentacles --json skills install

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: tentacles-wheel
          path: dist/*.whl

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.whl --clobber
          else
            gh release create "$TAG" dist/*.whl --generate-notes --title "$TAG"
          fi
