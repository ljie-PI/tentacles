# tentacles 配置文件
#
# - ${VAR} / ${VAR:-默认值} 从环境变量读取（也会读取项目根目录或本目录的 .env，
#   但不覆盖已存在的环境变量）。密钥一律放在 .env，不要写进本文件。
# - 相对路径一律相对于本文件所在目录解析。
# - 校验：tentacles config check

app:
  timezone: Asia/Shanghai     # 展示与 cron 计算使用的时区；数据库内一律存 UTC
  data_dir: ../data           # SQLite 数据库位置
  reports_dir: ../reports     # 报告输出目录

# 命名模型：不填写 key 也可以校验配置、抓取 RSS；实际调用时才报 upstream。
# provider: openai（包括 DeepSeek/Moonshot/Ollama/vLLM）、anthropic、openrouter。
# kind 默认为 chat。base_url 是 API 根路径；模型 ID 请按服务商当前可用型号调整。
models:
  fast:
    provider: openai
    model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY:-}
    max_tokens: 4096
    timeout: 60
    retries: 2
  smart:
    provider: anthropic
    model: claude-sonnet-5-5
    api_key: ${ANTHROPIC_API_KEY:-}
    max_tokens: 4096
  max:
    provider: anthropic
    model: claude-opus-5-5
    api_key: ${ANTHROPIC_API_KEY:-}
    max_tokens: 8192
  decision:
    provider: openrouter
    kind: decision
    model: typesafe/jev-1.13
    api_key: ${OPENROUTER_API_KEY:-}
    concurrency: 8
    extra_body:
      provider: {data_collection: deny}

defaults:
  models:
    extract: fast
    filter: fast
    decision: decision
    persona: max
    process: smart

# 演化使用 defaults.models.persona；只由显式 persona evolve 调用（可能产生费用）。
persona_update:
  feedback_window: 30d
  max_feedback: 100
  max_profile_chars: 12000

# 只在数据库不存在同名 persona 时导入；之后修改这里不会覆盖已存版本。
# profile 与 profile_file 二选一；文件路径相对本 YAML 所在目录。
# 首次导入不调用模型；persona set 修改 profile 才抽取标签（可 --skip-tags）。
personas:
  default:
    profile: |
      优先关注人工智能与开源软件的实质进展。
      其次关注科技产业、机器人、科学和能源。
      不关注重复营销、广告和缺乏事实依据的炒作。
    include: [人工智能, AI, 开源]
    exclude: [广告, 促销]

# 信息源。通用字段：id（唯一）、type、schedule（抓取频率：30m / 2h / 1d 等间隔，
# 或 @hourly/@daily/@weekly、5 段 cron 表达式）、name（可选显示名）、enabled（默认 true）。
#
# type: rss 的选项：
#   url            RSS/Atom 地址（必填）
#   max_age_days   丢弃早于 N 天发布的条目（可选）
#   headers        额外请求头（可选）
#   proxy          该源专用代理（可选）
#   timeout        请求超时秒数（默认 30）
sources:
  # 中文
  - {id: solidot, type: rss, url: "https://www.solidot.org/index.rss", schedule: 1h}
  - {id: 36kr, type: rss, url: "https://36kr.com/feed", schedule: 1h}
  - {id: sspai, name: 少数派, type: rss, url: "https://sspai.com/feed", schedule: 2h}
  - {id: bbc-zh, name: BBC中文, type: rss, url: "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml", schedule: 1h}
  - {id: jiemian, name: 界面新闻, type: rss, url: "https://www.jiemian.com/rss/all.xml", schedule: 1h}
  # 英文
  - {id: hacker-news, type: rss, url: "https://hnrss.org/frontpage", schedule: 30m, max_age_days: 2}
  - {id: techcrunch, type: rss, url: "https://techcrunch.com/feed/", schedule: 1h}
  - {id: the-verge, type: rss, url: "https://www.theverge.com/rss/index.xml", schedule: 1h}
  - {id: ars-technica, type: rss, url: "https://feeds.arstechnica.com/arstechnica/index", schedule: 2h}
  - {id: nytimes-world, type: rss, url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml", schedule: 1h}
  - {id: cnbc-top, type: rss, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01", schedule: 1h}

  # 邮箱默认关闭，避免配置尚未完成时连接真实邮箱；显式 sources fetch inbox 可手动测试。
  # 仅支持密码/应用专用密码登录，不支持 Outlook.com 要求的 OAuth2。
  - id: inbox
    type: imap
    name: 邮箱
    enabled: false
    schedule: 30m
    host: ${IMAP_HOST:-imap.gmail.com}
    port: 993
    ssl: true
    username: ${IMAP_USERNAME:-}
    password: ${IMAP_PASSWORD:-}
    folders: [INBOX]
    initial_days: 30
    max_fetch: 100          # 所有文件夹合计；被排除/已删除的 UID 也计入上限
    search: ALL            # 可用 UNSEEN、FROM "sender@example.com" 等 IMAP 搜索条件
    exclude_senders: []    # 发件人的完整邮箱地址，不区分大小写
    max_body_chars: 20000
    max_summary_chars: 2000
    timeout: 30

  # 网页示例均默认关闭；URL 和 CSS 需替换为实际站点，完整语义见 docs/web-sources.md。
  - id: web-list
    type: web
    mode: list
    name: 网页列表
    enabled: false
    schedule: 1h
    url: https://example.com/news
    selectors:
      item: article
      title: h2
      link: a@href
      summary: .summary
      date: time@datetime
    fetch_content: true
    concurrency: 4
    headers: {}
    cookies: {}
    timeout: 30
    proxy: ${HTTP_PROXY:-}
  - id: web-page
    type: web
    mode: page
    name: 页面监控
    enabled: false
    schedule: 30m
    url: https://example.com/status
    selector: main
    emit_baseline: true
    headers: {}
    cookies: {}
    timeout: 30
    proxy: ${HTTP_PROXY:-}

  # 杂乱页面的付费抽取示例，默认关闭；使用 defaults.models.extract。
  - id: web-llm
    type: web
    mode: llm
    name: 网页智能抽取
    enabled: false
    schedule: 2h
    url: https://example.com/updates
    # model: fast          # 可选显式覆盖；必须是 chat 模型
    max_input_chars: 20000
    fetch_content: false
    headers: {}
    cookies: {}
    timeout: 30
    proxy: ${HTTP_PROXY:-}

# tick 会先抓取、再只过滤、最后运行到期的 pipeline；模型调用可能产生费用。
# 也可手动执行 pipelines filter/run ID；enabled: false 关闭自动执行。
pipelines:
  - id: daily-tech
    name: 每日科技日报
    persona: default
    sources: [solidot, 36kr, sspai, bbc-zh, jiemian, hacker-news, techcrunch, the-verge, ars-technica, nytimes-world, cnbc-top]
    window: 24h
    schedule: '@daily'
    filter_schedule: 30m      # 可省略；此处更频繁地只过滤，到午夜再生成日报
    max_items: 500
    filters:
      - type: keyword
        reject_below: 0.5
        accept_above: 1.0
      # 可选：填好 OPENROUTER_API_KEY 后取消下面注释，启用 decision 过滤。
      # 默认仍只用 keyword，避免升级后自动产生额外模型调用。
      # - type: decision
      #   model: decision         # 可省略，默认 defaults.models.decision
      #   relevance_type: noul    # 或 score：四级量表归一化到 0–1
      #   reject_below: 0.3
      #   accept_above: 0.8
      # 可选：让聊天模型批量处理前面阶段拿不准的项（同样可能产生费用）。
      # - type: llm
      #   model: fast             # 可省略，默认 defaults.models.filter
      #   batch_size: 20
      #   reject_below: 0.5
    processor:
      type: digest
      language: zh-CN
      max_items: 60
      instructions: 优先按兴趣画像组织事实，避免标题党和重复表述。


  # 每周重大事件深度报道：默认关闭，启用后会调用 max 模型（可能产生费用）。
  # 手动 pipelines run weekly-deep 同样会调用模型，即使 enabled: false。
  - id: weekly-deep
    name: 每周重大事件
    persona: default
    sources: [solidot, 36kr, sspai, bbc-zh, jiemian, hacker-news, techcrunch, the-verge, ars-technica, nytimes-world, cnbc-top]
    enabled: false
    window: 7d
    schedule: '@weekly'
    filters:
      - type: keyword
    processor:
      type: deep
      model: max
      language: zh-CN
      max_items: 100
      min_cluster_size: 3    # 同一事件至少 3 个条目（不是独立来源数）
      max_reports: 3         # 仅取规模最大的前 3 个达标事件
      instructions: 区分已证实的事实与各方说法，明确列出仍需核实的问题。

  # 邮件简报：源 inbox 和本 pipeline 均默认关闭，确认隐私与模型费用后再启用。
  # 手动 pipelines run mail-summary 仍会调用 process 模型（即使 enabled: false）。
  - id: mail-summary
    name: 邮件简报
    persona: default
    sources: [inbox]
    enabled: false
    window: 7d
    schedule: '@daily'
    filters: []             # 可按需求添加 keyword / decision / llm；此处保留全部邮件
    processor:
      type: summarize
      language: zh-CN
      max_items: 50
      instructions: 仅提取邮件明确要求的待办，无法确定截止日期时留空。
