# tentacles 配置文件
#
# - ${VAR} / ${VAR:-默认值} 从环境变量读取（也会读取项目根目录或本目录的 .env，
#   但不覆盖已存在的环境变量）。密钥一律放在 .env，不要写进本文件。
# - 相对路径一律相对于本文件所在目录解析。
# - 校验：tentacles config check

app:
  timezone: Asia/Shanghai     # 展示与 cron 计算使用的时区；数据库内一律存 UTC
  data_dir: ../data           # SQLite 数据库位置
  reports_dir: ../reports     # 报告输出目录

# 命名模型：不填写 key 也可以校验配置、抓取 RSS；实际调用时才报 upstream。
# provider: openai（包括 DeepSeek/Moonshot/Ollama/vLLM）、anthropic、openrouter。
# kind 默认为 chat。base_url 是 API 根路径；模型 ID 请按服务商当前可用型号调整。
models:
  fast:
    provider: openai
    model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY:-}
    max_tokens: 4096
    timeout: 60
    retries: 2
  smart:
    provider: anthropic
    model: claude-sonnet-5-5
    api_key: ${ANTHROPIC_API_KEY:-}
    max_tokens: 4096
  max:
    provider: anthropic
    model: claude-opus-5-5
    api_key: ${ANTHROPIC_API_KEY:-}
    max_tokens: 8192
  decision:
    provider: openrouter
    kind: decision
    model: typesafe/jev-1.13
    api_key: ${OPENROUTER_API_KEY:-}
    concurrency: 8
    extra_body:
      provider: {data_collection: deny}

defaults:
  models:
    extract: fast
    filter: fast
    decision: decision
    persona: smart
    process: smart

# 信息源。通用字段：id（唯一）、type、schedule（抓取频率：30m / 2h / 1d 等间隔，
# 或 @hourly/@daily/@weekly、5 段 cron 表达式）、name（可选显示名）、enabled（默认 true）。
#
# type: rss 的选项：
#   url            RSS/Atom 地址（必填）
#   max_age_days   丢弃早于 N 天发布的条目（可选）
#   headers        额外请求头（可选）
#   proxy          该源专用代理（可选）
#   timeout        请求超时秒数（默认 30）
sources:
  # 中文
  - {id: solidot, type: rss, url: "https://www.solidot.org/index.rss", schedule: 1h}
  - {id: 36kr, type: rss, url: "https://36kr.com/feed", schedule: 1h}
  - {id: sspai, name: 少数派, type: rss, url: "https://sspai.com/feed", schedule: 2h}
  - {id: bbc-zh, name: BBC中文, type: rss, url: "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml", schedule: 1h}
  - {id: jiemian, name: 界面新闻, type: rss, url: "https://www.jiemian.com/rss/all.xml", schedule: 1h}
  # 英文
  - {id: hacker-news, type: rss, url: "https://hnrss.org/frontpage", schedule: 30m, max_age_days: 2}
  - {id: techcrunch, type: rss, url: "https://techcrunch.com/feed/", schedule: 1h}
  - {id: the-verge, type: rss, url: "https://www.theverge.com/rss/index.xml", schedule: 1h}
  - {id: ars-technica, type: rss, url: "https://feeds.arstechnica.com/arstechnica/index", schedule: 2h}
  - {id: nytimes-world, type: rss, url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml", schedule: 1h}
  - {id: cnbc-top, type: rss, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01", schedule: 1h}
