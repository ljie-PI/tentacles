# tentacles 配置文件
#
# - ${VAR} / ${VAR:-默认值} 从环境变量读取（也会读取项目根目录或本目录的 .env，
#   但不覆盖已存在的环境变量）。密钥一律放在 .env，不要写进本文件。
# - 相对路径一律相对于本文件所在目录解析。
# - 校验：tentacles config check

app:
  timezone: Asia/Shanghai     # 展示与 cron 计算使用的时区；数据库内一律存 UTC
  data_dir: ../data           # SQLite 数据库位置
  reports_dir: ../reports     # 报告输出目录
  storage:                    # 冷热分层：`tentacles --json storage` 运维命令的默认值
    hot_retention_days: 365   # 热库保留天数；`storage archive` 默认把更早的条目按自然年搬进冷库
    archive_dir: ../data/archive  # 年度冷库目录（tentacles-YYYY.db），相对本文件解析

# 命名模型：不填写 key 也可以校验配置、抓取 RSS；实际调用时才报 upstream。
# provider: openai（包括 DeepSeek/Moonshot/Ollama/vLLM）、anthropic、openrouter。
# kind 默认为 chat。base_url 是 API 根路径；模型 ID 请按服务商当前可用型号调整。
models:
  fast:
    provider: openai
    model: deepseek-flash
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY:-}
    max_tokens: 4096
    timeout: 60
    retries: 2
  smart:
    provider: anthropic
    model: claude-sonnet-5-5
    api_key: ${ANTHROPIC_API_KEY:-}
    max_tokens: 4096
  max:
    provider: anthropic
    model: claude-opus-5-5
    api_key: ${ANTHROPIC_API_KEY:-}
    max_tokens: 8192
  decision:
    provider: openrouter
    kind: decision
    model: typesafe/jev-1.13
    api_key: ${OPENROUTER_API_KEY:-}
    concurrency: 8
    extra_body:
      provider: {data_collection: deny}

defaults:
  models:
    extract: fast
    filter: fast
    decision: decision
    persona: max
    process: smart

# 演化使用 defaults.models.persona；只由显式 persona evolve 调用（可能产生费用）。
persona_update:
  feedback_window: 30d
  max_feedback: 100
  max_profile_chars: 12000

# 只在数据库不存在同名 persona 时导入；之后修改这里不会覆盖已存版本。
# profile 与 profile_file 二选一；文件路径相对本 YAML 所在目录。
# 首次导入不调用模型；persona set 修改 profile 才抽取标签（可 --skip-tags）。
# exclude 是“软排除”：同时命中 include 时由 keyword 阶段豁免，转交下一关语义精判；
# hard_exclude 是“硬排除”：无歧义的垃圾特征，命中即 0 分淘汰（如《限时特惠…》）。
personas:
  default:
    profile: |
      优先关注人工智能与开源软件的实质进展。
      其次关注科技产业、机器人、科学和能源。
      不关注重复营销、广告和缺乏事实依据的炒作。
    include: [人工智能, AI, 开源]
    exclude: [广告, 促销]
    hard_exclude: ['限时特惠', '扫码加群']

# 有界面 Chrome 运行时（type: browser）。严格禁止无头模式：复用你已登录的 Chrome Profile，
# 通过 CDP 附着或按需拉起可见窗口，并在新建的隔离工作 Tab 中重放固化脚本。
# 前置条件、Profile 核验与脚本规范见 docs/manual/user/sources.md 与 scripts/browser_sources/README.md。
browser:
  cdp_url: http://127.0.0.1:9222          # Chrome Remote Debugging 端点（connect_over_cdp 附着）
  webbridge_url: http://127.0.0.1:10086   # 冷启动探索的一次性本地工具桥接端点（仅回环地址）
  auto_launch: false                      # CDP 无人监听时是否自动拉起有界面 Chrome（绝不传 --headless）
  chrome_executable: null                 # 可选显式 Chrome 可执行文件路径
  chrome_user_data_dir: null              # 可选 Chrome User Data 根目录（auto_launch 时必填）
  default_profile: Default                # 默认 Chrome Profile 目录名（如 Default、Profile 1）
  scripts_dir: ../scripts/browser_sources # 固化 Playwright 脚本目录；相对本文件解析
  pi:                                     # 冷启动探索、提炼与重放自愈所用的 Agent 模型
    binary: pi
    model: anthropic/claude-sonnet-4-6
    reasoning_level: high                 # off | minimal | low | medium | high | xhigh | max
    timeout: 300
  pr:                                     # 提炼/自愈脚本的评审分支与 GitHub PR（需本机 gh 已登录）
    enabled: true                         # false：只保存本地脚本，不跑 git/gh
    base_branch: master                   # PR 目标分支（绝不直接推它）
    branch_prefix: auto/browser-source-   # 最终分支：<prefix><source_id>，同源复用一个分支
    labels: [ready-for-human]             # gh pr create --label，至少一个

# 信息源。通用字段：id（唯一）、type、schedule（抓取频率：30m / 2h / 1d 等间隔，
# 或 @hourly/@daily/@weekly、5 段 cron 表达式）、name（可选显示名）、enabled（默认 true）。
#
# type: rss 的选项：
#   url            RSS/Atom 地址（必填）
#   max_age_days   丢弃早于 N 天发布的条目（可选）
#   headers        额外请求头（可选）
#   proxy          该源专用代理（可选）
#   timeout        请求超时秒数（默认 30）
sources:
  # 中文
  - {id: solidot, type: rss, url: "https://www.solidot.org/index.rss", schedule: 1h}
  - {id: 36kr, type: rss, url: "https://36kr.com/feed", schedule: 1h}
  - {id: sspai, name: 少数派, type: rss, url: "https://sspai.com/feed", schedule: 2h}
  - {id: bbc-zh, name: BBC中文, type: rss, url: "https://feeds.bbci.co.uk/zhongwen/simp/rss.xml", schedule: 1h}
  - {id: jiemian, name: 界面新闻, type: rss, url: "https://www.jiemian.com/rss/all.xml", schedule: 1h}
  # 英文
  - {id: hacker-news, type: rss, url: "https://hnrss.org/frontpage", schedule: 30m, max_age_days: 2}
  - {id: techcrunch, type: rss, url: "https://techcrunch.com/feed/", schedule: 1h}
  - {id: the-verge, type: rss, url: "https://www.theverge.com/rss/index.xml", schedule: 1h}
  - {id: ars-technica, type: rss, url: "https://feeds.arstechnica.com/arstechnica/index", schedule: 2h}
  - {id: nytimes-world, type: rss, url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml", schedule: 1h}
  - {id: cnbc-top, type: rss, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01", schedule: 1h}

  # 邮箱默认关闭，避免配置尚未完成时连接真实邮箱；显式 sources fetch inbox 可手动测试。
  # 仅支持密码/应用专用密码登录，不支持 Outlook.com 要求的 OAuth2。
  - id: inbox
    type: imap
    name: 邮箱
    enabled: false
    schedule: 30m
    host: ${IMAP_HOST:-imap.gmail.com}
    port: 993
    ssl: true
    username: ${IMAP_USERNAME:-}
    password: ${IMAP_PASSWORD:-}
    folders: [INBOX]
    initial_days: 30
    max_fetch: 100          # 所有文件夹合计；被排除/已删除的 UID 也计入上限
    search: ALL            # 可用 UNSEEN、FROM "sender@example.com" 等 IMAP 搜索条件
    exclude_senders: []    # 发件人的完整邮箱地址，不区分大小写
    max_body_chars: 20000
    max_summary_chars: 2000
    timeout: 30

  # 网页示例均默认关闭；URL 和 CSS 需替换为实际站点，完整语义见 docs/manual/user/sources.md。
  - id: web-list
    type: web
    mode: list
    name: 网页列表
    enabled: false
    schedule: 1h
    url: https://example.com/news
    selectors:
      item: article
      title: h2
      link: a@href
      summary: .summary
      date: time@datetime
    fetch_content: true
    # 详情页失败策略：fail_batch（默认，整批回滚不推进游标但是失败详情逐条落账本）
    # 或 record_and_skip（失败单篇只落账本，其余正常入库，失败 target_url 下一轮自动重试）。
    # on_detail_error: record_and_skip
    concurrency: 4
    headers: {}
    cookies: {}
    timeout: 30
    proxy: ${HTTP_PROXY:-}
  - id: web-page
    type: web
    mode: page
    name: 页面监控
    enabled: false
    schedule: 30m
    url: https://example.com/status
    selector: main
    emit_baseline: true
    headers: {}
    cookies: {}
    timeout: 30
    proxy: ${HTTP_PROXY:-}

  # 杂乱页面的付费抽取示例，默认关闭；使用 defaults.models.extract。
  - id: web-llm
    type: web
    mode: llm
    name: 网页智能抽取
    enabled: false
    schedule: 2h
    url: https://example.com/updates
    # model: fast          # 可选显式覆盖；必须是 chat 模型
    max_input_chars: 20000
    fetch_content: false
    headers: {}
    cookies: {}
    timeout: 30
    proxy: ${HTTP_PROXY:-}

  # 有界面浏览器源：附着已登录的 Chrome Profile，重放 scripts/browser_sources/ 下的固化脚本。
  # 默认关闭；需先启动带调试端口的 Chrome（见 docs/manual/user/sources.md）。
  - id: reddit-localllama
    type: browser
    name: r/LocalLLaMA 最新讨论
    enabled: false
    schedule: 1h
    page_url: https://www.reddit.com/r/LocalLLaMA/new/
    task: >
      打开 r/LocalLLaMA 的 New 列表页，抓取前 20 条帖子的标题、帖子详情链接、作者、发布时间和正文摘要，
      跳过置顶广告（promoted）。
    # chrome_profile: Profile 1           # 可选：覆盖 browser.default_profile
    update_existing: false                # 可选：同源规范化 URL 原位更新（与 web list 一致）
    on_detail_error: record_and_skip      # fail_batch | record_and_skip
    script_path: ../scripts/browser_sources/reddit-localllama.py  # 可省略，缺省为 <scripts_dir>/<id>.py
    max_items: 25
    timeout: 60                           # 单次重放整体超时秒数
    # headless: true                      # 不允许：有界面运行时直接报配置错误

# tick 会先抓取、再只过滤、最后运行到期的 pipeline；模型调用可能产生费用。
# 也可手动执行 pipelines filter/run ID；enabled: false 关闭自动执行。
pipelines:
  - id: daily-tech
    name: 每日科技日报
    persona: default
    sources: [solidot, 36kr, sspai, bbc-zh, jiemian, hacker-news, techcrunch, the-verge, ars-technica, nytimes-world, cnbc-top]
    window: 24h
    schedule: '@daily'
    filter_schedule: 30m      # 可省略；此处更频繁地只过滤，到午夜再生成日报
    max_items: 500
    filters:
      # guard_ambiguous_exclude（默认 true）：软 exclude 与正向词同时命中时给 0.55 分，
      # 不淘汰也不满分短路，交给下一关结合完整画像裁决；只命中软 exclude 仍 0 分淘汰。
      # 纯正向命中：accept_above 要求 1.0 时给 1.0（保留旧短路省钱用法），否则 0.85。
      - type: keyword
        reject_below: 0.5
        accept_above: 1.0
        # 阶段级硬排除：命中即淘汰。正则特征需同时打开 regex: true。
        # hard_exclude: ['sponsored\s+by']
        # regex: true
      # 可选：填好对应 API key 后取消下面注释，启用统一语义过滤（会产生费用）。
      # 默认仍只用 keyword，避免升级后自动产生额外模型调用。
      # 同一块配置同时适配 chat 与 decision 模型，实际链路取决于模型的 kind；
      # 旧写法 type: llm / type: decision 仍然合法。
      # - type: semantic
      #   model: fast                 # 可省略：semantic/llm 用 defaults.models.filter，decision 用 defaults.models.decision
      #   batch_size: 20              # 每 20 条一个 batch，也是增量落库检查点（1~100）
      #   summary_chars: 160          # 每条附带的短摘要上限，0 表示只发标题（0~1000）
      #   reject_below: 0.5
      #   accept_above: 0.85
      #   # 仅当所选模型 kind 为 decision（JEV）时生效：
      #   relevance_type: noul        # 或 score：四级量表归一化到 0–1
      #   jev_batch_mode: packed_questions  # 或 windowed_pool：逐条并发请求
    processor:
      type: digest
      language: zh-CN
      max_items: 60
      instructions: 优先按兴趣画像组织事实，避免标题党和重复表述。


  # 每周重大事件深度报道：默认关闭，启用后会调用 max 模型（可能产生费用）。
  # 手动 pipelines run weekly-deep 同样会调用模型，即使 enabled: false。
  - id: weekly-deep
    name: 每周重大事件
    persona: default
    sources: [solidot, 36kr, sspai, bbc-zh, jiemian, hacker-news, techcrunch, the-verge, ars-technica, nytimes-world, cnbc-top]
    enabled: false
    window: 7d
    schedule: '@weekly'
    filters:
      - type: keyword
    processor:
      type: deep
      model: max
      language: zh-CN
      max_items: 100
      min_cluster_size: 3    # 同一事件至少 3 个条目（不是独立来源数）
      max_reports: 3         # 仅取规模最大的前 3 个达标事件
      instructions: 区分已证实的事实与各方说法，明确列出仍需核实的问题。

  # 邮件简报：源 inbox 和本 pipeline 均默认关闭，确认隐私与模型费用后再启用。
  # 手动 pipelines run mail-summary 仍会调用 process 模型（即使 enabled: false）。
  - id: mail-summary
    name: 邮件简报
    persona: default
    sources: [inbox]
    enabled: false
    window: 7d
    schedule: '@daily'
    filters: []             # 可按需求添加 keyword / semantic；此处保留全部邮件
    processor:
      type: summarize
      language: zh-CN
      max_items: 50
      instructions: 仅提取邮件明确要求的待办，无法确定截止日期时留空。

# REST API / 网页（tentacles serve）。默认只监听本机；对外访问需 token + HTTPS 代理。
server:
  host: 127.0.0.1
  port: 8000
  token: ${TENTACLES_SERVER_TOKEN:-}
  cors_origins: []          # 仅允许明确列出的 origin，如 http://localhost:5173；默认同源
  scheduler: true
  poll_interval: 30         # 秒；单轮出错后继续，关闭时等待当前轮结束
  static_dir: ../frontend/dist  # pnpm build 的产物；相对本 YAML
