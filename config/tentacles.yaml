# tentacles 配置文件
#
# - ${VAR} / ${VAR:-默认值} 从环境变量读取（也会读取项目根目录或本目录的 .env，
#   但不覆盖已存在的环境变量）。密钥一律放在 .env，不要写进本文件。
# - 相对路径一律相对于本文件所在目录解析。
# - 校验：tentacles config check

app:
  timezone: Asia/Shanghai     # 展示与 cron 计算使用的时区；数据库内一律存 UTC
  data_dir: ../data           # SQLite 数据库位置
  reports_dir: ../reports     # 报告输出目录
  storage:                    # 冷热分层：`tentacles --json storage` 运维命令的默认值
    hot_retention_days: 365   # 热库保留天数；`storage archive` 默认把更早的条目按自然年搬进冷库
    archive_dir: ../data/archive  # 年度冷库目录（tentacles-YYYY.db），相对本文件解析

# 命名模型：不填写 key 也可以校验配置、抓取 RSS；实际调用时才报 upstream。
# provider: openai、openai-compatible（须填 base_url）、anthropic、openrouter、opencode-go。
# kind 默认为 chat。模型 ID 请按服务商当前可用型号调整。
models:
  chat:
    provider: opencode-go
    model: deepseek-v4.1-flash
    api_key: ${OPENCODE_GO_API_KEY:-}
    max_tokens: 4096
    timeout: 60
    retries: 2
  fast:
    provider: opencode-go
    model: deepseek-v4.1-flash
    api_key: ${OPENCODE_GO_API_KEY:-}
    max_tokens: 4096
    timeout: 60
    retries: 2
  smart:
    provider: opencode-go
    model: glm-5.3
    api_key: ${OPENCODE_GO_API_KEY:-}
    max_tokens: 8192
    timeout: 120
    retries: 2
  max:
    provider: opencode-go
    model: glm-5.3
    api_key: ${OPENCODE_GO_API_KEY:-}
    max_tokens: 8192
    timeout: 120
    retries: 2
  decision:
    provider: openrouter
    kind: decision
    model: typesafe/jev-1.13
    api_key: ${OPENROUTER_API_KEY:-}
    concurrency: 8
    extra_body:
      provider: {data_collection: deny}

defaults:
  models:
    extract: fast
    filter: fast
    decision: decision
    persona: max
    process: smart

# 演化使用 defaults.models.persona；只由显式 persona evolve 调用（可能产生费用）。
persona_update:
  feedback_window: 30d
  max_feedback: 100
  max_profile_chars: 12000

# 只在数据库不存在同名 persona 时导入；之后修改这里不会覆盖已存版本。
# profile 与 profile_file 二选一；文件路径相对本 YAML 所在目录。
# 首次导入不调用模型；persona set 修改 profile 才抽取标签（可 --skip-tags）。
# exclude 是“软排除”：同时命中 include 时由 keyword 阶段豁免，转交下一关语义精判；
# hard_exclude 是“硬排除”：无歧义的垃圾特征，命中即 0 分淘汰（如《限时特惠…》）。
personas:
  default:
    profile: |
      优先关注人工智能、LLM、开源软件与量化金融的实质技术进展，重视能够解释原理、验证效果或复用到实际系统中的研究与工程内容。

      AI/LLM 技术重点：新的模型架构及其设计取舍，包括 Transformer 改进、MoE、状态空间模型与混合架构；模型训练与评测；推理优化，包括量化、蒸馏、KV cache、注意力优化、推测解码、推理引擎，以及性能、成本和效果的实测对比；Agent 架构与应用场景，包括规划、记忆、工具调用、多智能体协作、RAG、工作流、可靠性评测，以及实际部署和应用案例；有实质技术价值的开源模型、框架、工具和项目，关注代码、架构、可复现性与实际用途，而不只看热度或发布消息。

      显著提高对 AI/LLM 技术博客、技术解读、原理解析、论文解读、工程实践和技术复盘的关注度。即使不是新产品发布或突发新闻，只要有扎实的技术解释、可复现的实验、代码、实验数据或实用工程经验，也应优先保留。兼顾中英文个人技术博客、研究团队与工程团队博客。

      金融技术重点：显著提高对量化交易、量化研究、金融模型与交易系统工程的关注度。优先关注因子与 Alpha 研究、统计套利、时间序列与金融机器学习、组合优化、资产定价、风险建模、衍生品定价、市场微观结构、算法交易与执行、回测和数据工程，以及 AI/LLM 在金融研究与交易中的技术应用。重视模型假设、数据质量、样本外验证、过拟合与数据泄漏、交易成本、风险控制，以及可复现的研究和开源量化工具。相比单纯行情播报、涨跌预测、荐股和投资营销，更优先保留有方法、模型、代码或实验依据的技术流内容。

      其次关注科技产业、机器人、科学和能源。
      不关注重复营销、广告和缺乏事实依据的炒作；不因文章使用 AI、量化或金融相关词汇就提高其优先级，不把未经验证的回测收益或投资承诺当作可靠结论。
    include:
      - 人工智能
      - AI
      - 开源
      - AI 技术博客
      - AI技术博客
      - 技术解读
      - 原理解析
      - 论文解读
      - 技术复盘
      - engineering blog
      - technical deep dive
      - LLM
      - 模型架构
      - 推理优化
      - Agent
      - 智能体
      - 开源项目
      - 量化交易
      - 量化研究
      - 金融模型
      - 因子模型
      - 风险建模
      - 组合优化
      - 统计套利
      - 回测
      - 算法交易
      - 金融机器学习
      - quantitative trading
      - quantitative research
      - financial modeling
      - inference optimization
      - model architecture
      - agent architecture
    exclude: [广告, 促销]
    hard_exclude: ['限时特惠', '扫码加群']

# 有界面 Chrome 运行时（type: browser）。严格禁止无头模式：复用你已登录的 Chrome Profile，
# 通过 CDP 附着或按需拉起可见窗口，并在新建的隔离工作 Tab 中重放固化脚本。
# 前置条件、Profile 核验与脚本规范见 README.md 与 scripts/browser_sources/README.md。
browser:
  cdp_url: http://127.0.0.1:9223          # Chrome Remote Debugging 端点（connect_over_cdp 附着）
  webbridge_url: http://127.0.0.1:10086   # 冷启动探索的一次性本地工具桥接端点（仅回环地址）
  auto_launch: true                       # CDP 无人监听时自动拉起有界面 Chrome（绝不传 --headless）
  chrome_executable: null                 # 可选显式 Chrome 可执行文件路径
  chrome_user_data_dir: ../data/chrome_profile  # Chrome User Data 根目录（相对本文件解析，可软连接复用现有目录）
  default_profile: Default                # 默认 Chrome Profile 目录名（如 Default、Profile 1）
  scripts_dir: ../scripts/browser_sources # 固化 Playwright 脚本目录；相对本文件解析
  pi:                                     # 冷启动探索、提炼与重放自愈所用的 Agent 模型
    binary: pi
    model: opencode-go/deepseek-v4.1-flash
    reasoning_level: high                 # off | minimal | low | medium | high | xhigh | max
    timeout: 300
  pr:                                     # 提炼/自愈脚本的评审分支与 GitHub PR（需本机 gh 已登录）
    enabled: true                         # false：只提交到本机评审分支，不 push、不调 gh
    base_branch: master                   # PR 目标分支（绝不直接推它）
    branch_prefix: auto/browser-source-   # 最终分支：<prefix><source_id>，同源复用一个分支
    labels: [ready-for-human]             # gh pr create --label，至少一个

# 信息源。通用字段：id（唯一）、type、schedule（抓取频率：30m / 2h / 1d 等间隔，
# 或 @hourly/@daily/@weekly、5 段 cron 表达式）、name（可选显示名）、enabled（默认 true）。
#
# type: rss 的选项：
#   url            RSS/Atom 地址（必填）
#   max_age_days   丢弃早于 N 天发布的条目（可选）
#   headers        额外请求头（可选）
#   proxy          该源专用代理（可选）
#   timeout        请求超时秒数（默认 30）
sources:
  # 中文
  - {id: solidot, type: rss, url: "https://www.solidot.org/index.rss", schedule: 4h}
  # 英文
  - {id: hacker-news, type: rss, url: "https://hnrss.org/frontpage", schedule: 4h, max_age_days: 2}
  - {id: techcrunch, type: rss, url: "https://techcrunch.com/feed/", schedule: 4h}
  - {id: the-verge, type: rss, url: "https://www.theverge.com/rss/index.xml", schedule: 4h}
  - {id: product-hunt, name: Product Hunt, type: rss, url: "http://www.producthunt.com/feed", schedule: 4h, max_age_days: 1}
  - {id: engadget, name: Engadget, type: rss, url: "http://www.engadget.com/rss-full.xml", schedule: 4h, max_age_days: 1}
  - {id: facebook-engineering, name: Facebook Engineering, type: rss, url: "https://code.facebook.com/posts/rss", schedule: 4h, max_age_days: 1}
  - {id: shopify-engineering, name: Shopify Engineering, type: rss, url: "https://shopifyengineering.myshopify.com/blogs/engineering.atom", schedule: 4h, max_age_days: 1}
  - {id: nvidia-developer, name: Nvidia Developer, type: rss, url: "https://developer.nvidia.com/blog/feed", schedule: 4h, max_age_days: 1}
  - {id: cmu-machine-learning, name: Machine Learning Blog @CMU, type: rss, url: "https://blog.ml.cmu.edu/feed/", schedule: 4h, max_age_days: 1}
  - {id: deepmind-blog, name: DeepMind Blog, type: rss, url: "https://deepmind.com/blog/feed/basic/", schedule: 4h, max_age_days: 1}
  - {id: mit-news-ai, name: MIT News - Artificial intelligence, type: rss, url: "http://news.mit.edu/rss/topic/artificial-intelligence2", schedule: 4h, max_age_days: 1}
  - {id: berkeley-ai-research, name: The Berkeley AI Research Blog, type: rss, url: "http://bair.berkeley.edu/blog/feed.xml", schedule: 4h, max_age_days: 1}
  - {id: openai-engineering, name: OpenAI Engineering, type: rss, url: "https://openai.com/news/engineering/rss.xml", schedule: 4h, max_age_days: 1}
  - {id: google-ai, name: Google AI Blog, type: rss, url: "http://googleresearch.blogspot.com/atom.xml", schedule: 4h, max_age_days: 1}
  - {id: towards-data-science, name: Towards Data Science, type: rss, url: "https://towardsdatascience.com/feed", schedule: 4h, max_age_days: 1}
  - {id: jiqizhixin, name: 微信公众号-机器之心, type: rss, url: "https://decemberpei.cyou/rssbox/wechat-jiqizhixin.xml", schedule: 4h, max_age_days: 1}
  - {id: liangziwei, name: 微信公众号-量子位, type: rss, url: "https://decemberpei.cyou/rssbox/wechat-liangziwei.xml", schedule: 4h, max_age_days: 1}
  - {id: xinzhiyuan, name: 微信公众号-新智元, type: rss, url: "https://decemberpei.cyou/rssbox/wechat-xinzhiyuan.xml", schedule: 4h, max_age_days: 1}
  - {id: deeptech, name: 微信公众号-DeepTech深科技, type: rss, url: "https://decemberpei.cyou/rssbox/wechat-shenkeji.xml", schedule: 4h, max_age_days: 1}
  - {id: paperweekly, name: 微信公众号-PaperWeekly, type: rss, url: "https://decemberpei.cyou/rssbox/wechat-paperweekly.xml", schedule: 4h, max_age_days: 1}
  - {id: ai-frontier, name: 微信公众号-AI前线, type: rss, url: "https://decemberpei.cyou/rssbox/wechat-aiqianxian.xml", schedule: 4h, max_age_days: 1}

  # GitHub Daily Trending（overall + 5 种语言）：静态网页列表抓取，按仓库 URL 全局去重。
  - id: github-trending-overall
    type: web
    mode: list
    name: GitHub Trending (Overall)
    schedule: '30 5 * * *'
    url: https://github.com/trending?since=daily
    selectors: {item: article.Box-row, title: h2 a, link: h2 a@href, summary: p}
  - id: github-trending-python
    type: web
    mode: list
    name: GitHub Trending (Python)
    schedule: '30 5 * * *'
    url: https://github.com/trending/python?since=daily
    selectors: {item: article.Box-row, title: h2 a, link: h2 a@href, summary: p}
  - id: github-trending-typescript
    type: web
    mode: list
    name: GitHub Trending (TypeScript)
    schedule: '30 5 * * *'
    url: https://github.com/trending/typescript?since=daily
    selectors: {item: article.Box-row, title: h2 a, link: h2 a@href, summary: p}
  - id: github-trending-rust
    type: web
    mode: list
    name: GitHub Trending (Rust)
    schedule: '30 5 * * *'
    url: https://github.com/trending/rust?since=daily
    selectors: {item: article.Box-row, title: h2 a, link: h2 a@href, summary: p}
  - id: github-trending-cpp
    type: web
    mode: list
    name: GitHub Trending (C++)
    schedule: '30 5 * * *'
    url: https://github.com/trending/c%2B%2B?since=daily
    selectors: {item: article.Box-row, title: h2 a, link: h2 a@href, summary: p}
  - id: github-trending-c
    type: web
    mode: list
    name: GitHub Trending (C)
    schedule: '30 5 * * *'
    url: https://github.com/trending/c?since=daily
    selectors: {item: article.Box-row, title: h2 a, link: h2 a@href, summary: p}

  # IMAP 邮箱源：凭据由 .env 注入；开启 include_subfolders 时自动展开子文件夹（未配置凭据时请设为 enabled: false）。
  # 仅支持密码/应用专用密码登录，不支持 Outlook.com 要求的 OAuth2。
  - id: mail-tech
    type: imap
    name: 科技订阅邮件
    enabled: true
    schedule: 4h
    host: ${IMAP_HOST:-imap.gmail.com}
    port: 993
    ssl: true
    username: ${IMAP_USERNAME:-}
    password: ${IMAP_PASSWORD:-}
    folders: ["Tech News"]
    include_subfolders: true
    initial_days: 14
    max_fetch: 100
  - id: mail-finance
    type: imap
    name: 金融订阅邮件
    enabled: true
    schedule: 4h
    host: ${IMAP_HOST:-imap.gmail.com}
    port: 993
    ssl: true
    username: ${IMAP_USERNAME:-}
    password: ${IMAP_PASSWORD:-}
    folders: ["Finance"]
    include_subfolders: true
    initial_days: 14
    max_fetch: 100

  # 有界面浏览器源：附着已登录的 Chrome Profile，重放 scripts/browser_sources/ 下的固化脚本。
  # 默认关闭；需先启动带调试端口的 Chrome（见 README.md）。
  - id: reddit-localllama
    type: browser
    name: r/LocalLLaMA 最新讨论
    enabled: false
    schedule: 4h
    page_url: https://www.reddit.com/r/LocalLLaMA/new/
    task: >
      打开 r/LocalLLaMA 的 New 列表页，抓取前 20 条帖子的标题、帖子详情链接、作者、发布时间和正文摘要，
      跳过置顶广告（promoted）。
    # chrome_profile: Profile 1           # 可选：覆盖 browser.default_profile
    update_existing: false                # 可选：同源规范化 URL 原位更新（与 web list 一致）
    on_detail_error: record_and_skip      # fail_batch | record_and_skip
    script_path: ../scripts/browser_sources/reddit-localllama.py  # 可省略，缺省为 <scripts_dir>/<id>.py
    max_items: 25
    timeout: 60                           # 单次重放整体超时秒数
    # headless: true                      # 不允许：有界面运行时直接报配置错误

# tick 会先抓取、再只过滤、最后运行到期的 pipeline；模型调用可能产生费用。
# 也可手动执行 pipelines filter/run ID；enabled: false 关闭自动执行。
pipelines:
  - id: daily-tech
    name: 科技早报
    persona: default
    sources:
      - solidot
      - hacker-news
      - techcrunch
      - the-verge
      - product-hunt
      - engadget
      - facebook-engineering
      - shopify-engineering
      - nvidia-developer
      - cmu-machine-learning
      - deepmind-blog
      - mit-news-ai
      - berkeley-ai-research
      - openai-engineering
      - google-ai
      - towards-data-science
      - jiqizhixin
      - liangziwei
      - xinzhiyuan
      - deeptech
      - paperweekly
      - ai-frontier
      - mail-tech
      - github-trending-overall
      - github-trending-python
      - github-trending-typescript
      - github-trending-rust
      - github-trending-cpp
      - github-trending-c
    enabled: true
    window: 24h
    schedule: '0 6 * * *'
    filter_schedule: 30m
    max_items: 1000
    filters:
      - type: keyword
        reject_below: 0.5
      - type: semantic
        model: fast
        batch_size: 20
        summary_chars: 600
        reject_below: 0.5
        instructions: >
          仅保留 AI/Agent 工程、模型评测、开源与开发工具、AI 游戏开发与内容管线、
          AI 科研及具有明确技术进展的产业消息；排除纯金融行情、招聘推广与无关娱乐社会新闻。
    processor:
      type: digest
      language: zh-CN
      max_items: 60
      prompt_file: prompts/tech-daily.md

  - id: weekly-tech
    name: 科技周报
    persona: default
    sources:
      - solidot
      - hacker-news
      - techcrunch
      - the-verge
      - product-hunt
      - engadget
      - facebook-engineering
      - shopify-engineering
      - nvidia-developer
      - cmu-machine-learning
      - deepmind-blog
      - mit-news-ai
      - berkeley-ai-research
      - openai-engineering
      - google-ai
      - towards-data-science
      - jiqizhixin
      - liangziwei
      - xinzhiyuan
      - deeptech
      - paperweekly
      - ai-frontier
      - mail-tech
      - github-trending-overall
      - github-trending-python
      - github-trending-typescript
      - github-trending-rust
      - github-trending-cpp
      - github-trending-c
    enabled: true
    window: 7d
    schedule: '0 18 * * 5'
    filter_schedule: 6h
    max_items: 5000
    filters:
      - type: keyword
        reject_below: 0.5
      - type: semantic
        model: fast
        batch_size: 20
        summary_chars: 600
        reject_below: 0.5
        instructions: >
          仅保留 AI/Agent 工程、模型评测、开源与开发工具、AI 游戏开发与内容管线、
          AI 科研及具有明确技术进展的产业消息；排除纯金融行情、招聘推广与无关娱乐社会新闻。
    processor:
      type: digest
      model: max
      language: zh-CN
      max_items: 150
      prompt_file: prompts/tech-weekly.md

  - id: weekly-finance
    name: 金融周报
    persona: default
    sources: [mail-finance]
    enabled: true
    window: 7d
    schedule: '0 18 * * 5'
    filter_schedule: 6h
    max_items: 2000
    filters:
      - type: keyword
        reject_below: 0.5
      - type: semantic
        model: fast
        batch_size: 20
        summary_chars: 600
        reject_below: 0.5
        instructions: >
          仅保留宏观经济、利率汇率、金融市场、企业财报、AI 与科技产业投融资及资本开支、
          监管政策和量化研究进展；排除无经济与金融关联的纯产品发布、纯招聘信息及课程推广。
    processor:
      type: digest
      model: max
      language: zh-CN
      max_items: 120
      prompt_file: prompts/finance-weekly.md

# REST API / 网页（tentacles serve）。默认只监听本机；对外访问需 token + HTTPS 代理。
server:
  host: 127.0.0.1
  port: 8000
  token: ${TENTACLES_SERVER_TOKEN:-}
  cors_origins: []          # 仅允许明确列出的 origin，如 http://localhost:5173；默认同源
  scheduler: true
  poll_interval: 30         # 秒；单轮出错后继续，关闭时等待当前轮结束
  static_dir: ../frontend/dist  # pnpm build 的产物；相对本 YAML
