# 信息源配置片段：不会由 config/tentacles.yaml 自动加载，也不是独立运行配置。
# web-list / web-llm 是任意 source ID，演示无 RSS 静态网站的两种抽取方式；详见 README.md。
# 按需把条目复制到主配置的 sources 中，并把 source ID 加入对应 pipeline.sources。
# 示例默认关闭，先换成实际 URL／选择器或账号，再显式开启。
# 可选字段省略时用内置默认值；浏览器连接、Profile、模型等全局设置只写一次。
sources:
  # 静态网页：CSS 列表抽取。适合无需登录、无需 JavaScript 的页面。
  - id: web-list
    type: web
    mode: list
    enabled: false
    schedule: 1h
    url: https://example.com/news
    selectors: {item: article, title: h2, link: 'a@href'}
    fetch_content: true

  # 静态页面变化监控，不是新闻列表抽取。
  - id: web-page
    type: web
    mode: page
    enabled: false
    schedule: 30m
    url: https://example.com/status
    selector: main

  # 静态网页：让 extract 模型识别新闻条目，不需要手写 CSS，但会消耗模型额度。
  # 仍不执行网页 JavaScript，也不能代替浏览器登录。
  - id: web-llm
    type: web
    mode: llm
    enabled: false
    schedule: 2h
    url: https://example.com/updates

  # Reddit 优先 RSS：每个 subreddit 一行即可，不需要配置浏览器。
  - {id: reddit-science, type: rss, enabled: false, schedule: 1h, url: 'https://www.reddit.com/r/science/new/.rss'}
  - {id: reddit-technology, type: rss, enabled: false, schedule: 1h, url: 'https://www.reddit.com/r/technology/new/.rss'}

  # RSS 不可用／需要登录时：在可见 Chrome 中探索页面并生成重放脚本。
  # script_path、max_items、timeout、chrome_profile 等可省略。
  - &reddit-browser
    id: reddit-localllama
    type: browser
    enabled: false
    schedule: 1h
    page_url: https://www.reddit.com/r/LocalLLaMA/new/
    task: 抓取当前 subreddit 的 New 列表前 20 条帖子，包含标题、详情链接、作者、时间与正文摘要，跳过广告。
  - <<: *reddit-browser
    id: reddit-machinelearning-browser
    page_url: https://www.reddit.com/r/MachineLearning/new/

  # X 的动态／登录页面用 browser，不是 web-list 或 web-llm。
  # USERNAME 是占位符；请先在配置的 Chrome Profile 里登录。
  - id: x-account
    type: browser
    enabled: false
    schedule: 30m
    page_url: https://x.com/USERNAME
    task: 抓取该账号最新 20 条原创帖子，包含正文、帖子详情链接、作者与发布时间，跳过置顶旧帖和广告。
